name: Sync Google Photos Album & Deploy Pages

on:
  schedule:
    # Runs once per day at 09:00 UTC (01:00 AM PST / 02:00 AM PDT)
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-album-sync"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract latest photo metadata and coordinates from Google Photos
        if: github.event_name != 'push'
        run: python3 scripts/extract_album.py

      - name: Commit and push updated album data if changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/photos.json data/photos.js
            git commit -m "chore(data): sync latest Google Photos album geolocation metadata"
            git push origin main
          else
            echo "No changes detected in Google Photos album metadata."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
